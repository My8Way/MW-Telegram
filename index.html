<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Twin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 1. Сингулярна точка */
        .singularity {
            width: 5px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
            cursor: pointer;
            position: absolute;
            z-index: 10;
        }

        .singularity.pulse-active {
            animation: organicPulse 2s infinite ease-in-out;
        }

        @keyframes organicPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 6px rgba(255, 255, 255, 0.3); opacity: 0.3; }
            50% { transform: scale(2.5); box-shadow: 0 0 20px rgba(255, 255, 255, 1); opacity: 1; }
        }

        /* Зоряний пил (замість спалаху) */
        .stardust {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            z-index: 9;
        }

        /* 2. Живий Атом з диханням та зафіксованими орбітами */
        .atom-container {
            position: absolute;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.4);
            transition: opacity 1.2s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 5;
            pointer-events: none; /* Блоковано до появи тексту */
        }

        .atom-container.breath {
            animation: atomBreath 4s infinite ease-in-out;
        }

        @keyframes atomBreath {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .atom-core {
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 18px rgba(255, 255, 255, 1);
        }

        .orbit {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 150px;
            height: 50px;
        }

        .orbit:nth-child(1) { transform: rotate(0deg); }
        .orbit:nth-child(2) { transform: rotate(60deg); }
        .orbit:nth-child(3) { transform: rotate(120deg); }

        /* Електрони рухаються повільніше (6s) */
        .electron {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffffff;
            offset-path: ellipse(75px 25px at 50% 50%);
            animation: orbitSlide 6s infinite linear;
        }

        .orbit:nth-child(2) .electron { animation-delay: -2s; }
        .orbit:nth-child(3) .electron { animation-delay: -4s; }

        @keyframes orbitSlide {
            0% { offset-distance: 0%; }
            100% { offset-distance: 100%; }
        }

        /* Контейнер тексту та дати */
        .stage-container {
            position: absolute;
            bottom: 22%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 6;
        }

        .caption {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 1.2s ease;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        /* Преміальне сегментоване поле дати */
        .date-box {
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transform: translateY(12px);
            transition: all 1s ease;
            pointer-events: none;
        }

        .date-box.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .date-segment {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 15px;
            letter-spacing: 2px;
            text-align: center;
            outline: none;
            padding: 4px 0;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .date-segment:focus {
            border-color: #ffffff;
        }

        .date-segment.year { width: 55px; }
        .date-segment.unit { width: 35px; }

        .date-divider {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }

        /* Стрілка «Вправо» з пульсацією */
        .arrow-right {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            margin-left: 10px;
        }

        .arrow-right.visible {
            opacity: 1;
            transform: scale(1);
            animation: arrowPulse 2s infinite ease-in-out;
        }

        @keyframes arrowPulse {
            0%, 100% { box-shadow: 0 0 4px rgba(255, 255, 255, 0.2); transform: scale(1); }
            50% { box-shadow: 0 0 12px rgba(255, 255, 255, 0.8); transform: scale(1.08); }
        }

        .arrow-right svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Комета */
        .comet-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 16px 3px #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
        }
    </style>
</head>
<body>

    <div class="singularity pulse-active" id="singularity"></div>

    <div class="atom-container" id="atom">
        <div class="orbit"><div class="electron"></div></div>
        <div class="orbit"><div class="electron"></div></div>
        <div class="orbit"><div class="electron"></div></div>
        <div class="atom-core"></div>
    </div>

    <div class="stage-container">
        <div class="caption" id="captionText">The birth of your digital origin</div>
        
        <div class="date-box" id="dateBox">
            <input type="text" class="date-segment year" id="yearInput" placeholder="РРРР" maxlength="4" autocomplete="off">
            <span class="date-divider">/</span>
            <input type="text" class="date-segment unit" id="monthInput" placeholder="ММ" maxlength="2" autocomplete="off">
            <span class="date-divider">/</span>
            <input type="text" class="date-segment unit" id="dayInput" placeholder="ДД" maxlength="2" autocomplete="off">
            
            <div class="arrow-right" id="arrowBtn">
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <div class="comet-particle" id="comet"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const singularity = document.getElementById('singularity');
        const atom = document.getElementById('atom');
        const captionText = document.getElementById('captionText');
        const dateBox = document.getElementById('dateBox');
        const yearInput = document.getElementById('yearInput');
        const monthInput = document.getElementById('monthInput');
        const dayInput = document.getElementById('dayInput');
        const comet = document.getElementById('comet');
        const arrowBtn = document.getElementById('arrowBtn');

        let isEvolved = false;
        let isCometLaunched = false;

        function haptic(type = 'light') {
            if (tg.HapticFeedback) {
                if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
                else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
                else tg.HapticFeedback.impactOccurred('light');
            }
        }

        // Точний такт вібрації під час пікового розширення (кожні 2 сек на 1000ms)
        const pulseInterval = setInterval(() => {
            if (!isEvolved) {
                setTimeout(() => haptic('light'), 1000);
            } else {
                clearInterval(pulseInterval);
            }
        }, 2000);

        // Потап на точку -> Спалах зоряного пилу + Поява Атома
        singularity.addEventListener('click', () => {
            if (isEvolved) return;
            isEvolved = true;
            clearInterval(pulseInterval);
            haptic('medium');

            // Ефект Зоряного пилу
            createStardust();

            singularity.style.opacity = '0';
            setTimeout(() => singularity.style.display = 'none', 400);

            // Поява Атома
            setTimeout(() => {
                atom.style.opacity = '1';
                atom.style.transform = 'scale(1)';
                atom.classList.add('breath');

                // Текст плавно проростає ЧЕРЕЗ 4 СЕКУНДИ
                setTimeout(() => {
                    captionText.style.opacity = '1';
                    atom.style.pointerEvents = 'all'; // Клікабельний тільки тепер!
                    atom.style.cursor = 'pointer';
                }, 4000);

            }, 300);
        });

        function createStardust() {
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'stardust';
                document.body.appendChild(particle);

                const angle = (i / 12) * Math.PI * 2;
                const dist = 40 + Math.random() * 30;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;

                particle.style.left = '50%';
                particle.style.top = '50%';
                particle.style.opacity = '1';

                particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 800,
                    easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
                }).onfinish = () => particle.remove();
            }
        }

        // Натискання на Атом -> зникає текст, з'являються коми дати
        atom.addEventListener('click', () => {
            if (!isEvolved) return;
            haptic('light');

            captionText.style.opacity = '0';
            
            setTimeout(() => {
                captionText.style.display = 'none';
                dateBox.classList.add('active');
                yearInput.focus();
            }, 800);
        });

        // Авто-перехід між полями дати
        yearInput.addEventListener('input', () => {
            if (yearInput.value.length === 4) monthInput.focus();
            triggerComet();
        });
        monthInput.addEventListener('input', () => {
            if (monthInput.value.length === 2) dayInput.focus();
        });

        // Політ комети навколо дати та перетворення на Стрілку
        function triggerComet() {
            if (isCometLaunched) return;
            isCometLaunched = true;
            haptic('medium');

            atom.style.transition = 'all 0.6s ease';
            atom.style.opacity = '0';
            atom.style.transform = 'scale(0.1)';

            setTimeout(() => {
                const rect = dateBox.getBoundingClientRect();
                
                comet.style.left = (rect.left - 15) + 'px';
                comet.style.top = (rect.top - 10) + 'px';
                comet.style.opacity = '1';

                // Дуга-підкреслення навколо дати
                setTimeout(() => {
                    comet.style.transition = 'all 0.9s cubic-bezier(0.16, 1, 0.3, 1)';
                    comet.style.left = (rect.right + 12) + 'px';
                    comet.style.top = (rect.top + 5) + 'px';

                    setTimeout(() => {
                        comet.style.opacity = '0';
                        arrowBtn.classList.add('visible');
                        haptic('heavy');
                    }, 850);
                }, 100);
            }, 300);
        }

        arrowBtn.addEventListener('click', () => {
            haptic('heavy');
            // Модуль 2
        });
    </script>
</body>
</html>
