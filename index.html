<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Twin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 1. Сингулярна точка */
        .singularity {
            width: 5px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
            cursor: pointer;
            position: absolute;
            z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .singularity.pulse-active {
            animation: organicPulse 2s infinite ease-in-out;
        }

        @keyframes organicPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 6px rgba(255, 255, 255, 0.4); opacity: 0.4; }
            50% { transform: scale(2.4); box-shadow: 0 0 18px rgba(255, 255, 255, 1); opacity: 1; }
        }

        /* М'яке свічення замість спалаху */
        .soft-glow {
            position: absolute;
            width: 1px;
            height: 1px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 120px 80px rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
            z-index: 9;
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 2. Статичний Атом з орбітальним рухом электронів */
        .atom-container {
            position: absolute;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.4);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            z-index: 5;
        }

        .atom-core {
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
        }

        /* Орбіти НЕ крутяться */
        .orbit {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            width: 150px;
            height: 50px;
        }

        .orbit:nth-child(1) { transform: rotate(0deg); }
        .orbit:nth-child(2) { transform: rotate(60deg); }
        .orbit:nth-child(3) { transform: rotate(120deg); }

        /* Електрони ковзають по зафіксованих орбітах */
        .electron {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffffff;
            offset-path: ellipse(75px 25px at 50% 50%);
            animation: orbitSlide 4s infinite linear;
        }

        .orbit:nth-child(2) .electron { animation-delay: -1.3s; }
        .orbit:nth-child(3) .electron { animation-delay: -2.6s; }

        @keyframes orbitSlide {
            0% { offset-distance: 0%; }
            100% { offset-distance: 100%; }
        }

        /* Контейнер для тексту та дати */
        .stage-container {
            position: absolute;
            bottom: 25%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            z-index: 6;
        }

        .caption {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 1.2s ease;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        /* Елегантне мінімалістичне поле дати */
        .date-box {
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 1s ease;
            pointer-events: none;
        }

        .date-box.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .date-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 16px;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
            padding: 6px 0;
            font-family: inherit;
            transition: border-color 0.4s ease;
        }

        .date-input:focus {
            border-color: rgba(255, 255, 255, 0.9);
        }

        .date-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 2px;
        }

        /* Стрілка «Вправо» */
        .arrow-right {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            margin-left: 8px;
        }

        .arrow-right.visible {
            opacity: 1;
            transform: scale(1);
        }

        .arrow-right svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Комета */
        .comet-particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 15px 3px #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="singularity pulse-active" id="singularity"></div>
    <div class="soft-glow" id="softGlow"></div>

    <div class="atom-container" id="atom">
        <div class="orbit"><div class="electron"></div></div>
        <div class="orbit"><div class="electron"></div></div>
        <div class="orbit"><div class="electron"></div></div>
        <div class="atom-core"></div>
    </div>

    <div class="stage-container">
        <div class="caption" id="captionText">The birth of your digital origin</div>
        
        <div class="date-box" id="dateBox">
            <input type="text" class="date-input" id="dateInput" placeholder="РРРР / ММ / ДД" maxlength="10" autocomplete="off">
            <div class="arrow-right" id="arrowBtn">
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <div class="comet-particle" id="comet"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const singularity = document.getElementById('singularity');
        const softGlow = document.getElementById('softGlow');
        const atom = document.getElementById('atom');
        const captionText = document.getElementById('captionText');
        const dateBox = document.getElementById('dateBox');
        const dateInput = document.getElementById('dateInput');
        const comet = document.getElementById('comet');
        const arrowBtn = document.getElementById('arrowBtn');

        let isEvolved = false;
        let isCometLaunched = false;

        function haptic(type = 'light') {
            if (tg.HapticFeedback) {
                if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
                else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
                else tg.HapticFeedback.impactOccurred('light');
            }
        }

        // Вібрація на кожен пік пульсації (кожні 2 сек)
        const pulseInterval = setInterval(() => {
            if (!isEvolved) {
                haptic('light');
            } else {
                clearInterval(pulseInterval);
            }
        }, 2000);

        // Потап на точку -> м'який розквіт Атома
        singularity.addEventListener('click', () => {
            if (isEvolved) return;
            isEvolved = true;
            clearInterval(pulseInterval);
            haptic('medium');

            // Згасання точки + м'яке сяйво
            singularity.classList.remove('pulse-active');
            singularity.style.opacity = '0';
            
            softGlow.style.opacity = '1';
            softGlow.style.transform = 'scale(150)';

            setTimeout(() => {
                softGlow.style.opacity = '0';
                singularity.style.display = 'none';

                // Поява статичного Атома
                atom.style.opacity = '1';
                atom.style.transform = 'scale(1)';

                // Текст плавно проростає ТІЛЬКИ через 4 секунди
                setTimeout(() => {
                    captionText.style.opacity = '1';
                }, 4000);

            }, 500);
        });

        // Натискання на Атом -> плавність розчинення тексту й поява дати
        atom.addEventListener('click', () => {
            if (!isEvolved || dateBox.classList.contains('active')) return;
            haptic('light');

            captionText.style.opacity = '0';
            
            setTimeout(() => {
                captionText.style.display = 'none';
                dateBox.classList.add('active');
            }, 1000);
        });

        // Ввід / фокус дати -> Атом розгортається в комету і плавно обгинає дату
        dateInput.addEventListener('focus', () => {
            if (isCometLaunched) return;
            isCometLaunched = true;
            haptic('medium');

            // Атом м'яко стискається
            atom.style.opacity = '0';
            atom.style.transform = 'scale(0.1)';

            setTimeout(() => {
                const rect = dateBox.getBoundingClientRect();
                
                // Старт комети згори дати
                comet.style.left = (rect.left - 10) + 'px';
                comet.style.top = (rect.top - 15) + 'px';
                comet.style.opacity = '1';

                // Плавне обгинання дати за дугою (підкреслення)
                setTimeout(() => {
                    comet.style.transition = 'all 0.9s cubic-bezier(0.4, 0, 0.2, 1)';
                    comet.style.left = (rect.right + 5) + 'px';
                    comet.style.top = (rect.bottom - 10) + 'px';

                    setTimeout(() => {
                        comet.style.opacity = '0';
                        arrowBtn.classList.add('visible');
                        haptic('heavy');
                    }, 850);
                }, 100);
            }, 400);
        });

        arrowBtn.addEventListener('click', () => {
            haptic('heavy');
            // Наступний крок
        });
    </script>
</body>
</html>
