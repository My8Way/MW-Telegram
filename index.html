<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin Origin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .cell {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #38bdf8 0%, #3b82f6 70%, transparent 100%);
            box-shadow: 0 0 25px #38bdf8;
            margin-bottom: 20px;
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="cell"></div>
    <h2>The birth of your digital origin</h2>
    <p style="color: #94a3b8; font-size: 14px;">Система готова до синхронізації.</p>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
