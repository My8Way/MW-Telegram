<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Digital Twin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #FFFDF0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Canvas для ідеально плавного вибуху */
        #fxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 8;
        }

        /* 1. Початкова сингулярність */
        .singularity {
            width: 5px;
            height: 5px;
            background-color: #FFFDF0;
            border-radius: 50%;
            box-shadow: 0 0 10px #FFFDF0;
            cursor: pointer;
            position: absolute;
            z-index: 10;
        }

        .singularity.pulse-active {
            animation: slowSingularityPulse 6s infinite ease-in-out;
        }

        @keyframes slowSingularityPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 6px rgba(255, 253, 240, 0.3); opacity: 0.4; }
            50% { transform: scale(2.2); box-shadow: 0 0 18px rgba(255, 253, 240, 1); opacity: 1; }
        }

        /* 2. Атом та його наближення */
        .atom-container {
            position: absolute;
            width: 160px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.01);
            z-index: 5;
            pointer-events: none;
        }

        .atom-container.zooming {
            opacity: 1;
            /* Повільне зумування ядра з далини протягом 2.5 секунд */
            transition: transform 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease;
            transform: scale(1);
        }

        .atom-container.breath {
            animation: atomBreath 6s infinite ease-in-out;
        }

        @keyframes atomBreath {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .atom-core {
            width: 10px;
            height: 10px;
            background: #FFFDF0;
            border-radius: 50%;
            box-shadow: 0 0 18px rgba(255, 253, 240, 1);
            animation: corePulse 6s infinite ease-in-out;
        }

        @keyframes corePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(255, 253, 240, 0.5); }
            50% { transform: scale(1.3); box-shadow: 0 0 22px rgba(255, 253, 240, 1); }
        }

        .orbit {
            position: absolute;
            border: 1px solid rgba(255, 253, 240, 0.25);
            border-radius: 50%;
            width: 150px;
            height: 50px;
            opacity: 0;
            transition: opacity 1.8s ease;
        }

        .atom-container.orbits-ready .orbit {
            opacity: 1;
        }

        .orbit:nth-child(1) { transform: rotate(0deg); }
        .orbit:nth-child(2) { transform: rotate(60deg); }
        .orbit:nth-child(3) { transform: rotate(120deg); }

        .electron {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #FFFDF0;
            border-radius: 50%;
            box-shadow: 0 0 8px #FFFDF0;
            offset-path: ellipse(75px 25px at 50% 50%);
            animation: orbitSlide 6s infinite linear;
        }

        .orbit:nth-child(2) .electron { animation-delay: -2s; }
        .orbit:nth-child(3) .electron { animation-delay: -4s; }

        @keyframes orbitSlide {
            0% { offset-distance: 0%; }
            100% { offset-distance: 100%; }
        }

        /* Контейнер тексту та дати */
        .stage-container {
            position: absolute;
            bottom: 22%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 6;
        }

        .caption {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 1.2s ease;
            color: rgba(255, 253, 240, 0.6);
            text-align: center;
        }

        /* Поле дати */
        .date-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: 0;
            transform: translateY(12px);
            transition: all 1s ease;
            pointer-events: none;
            margin: 0 auto;
        }

        .date-box.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .date-segment {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 253, 240, 0.3);
            color: #FFFDF0;
            font-size: 15px;
            letter-spacing: 2px;
            text-align: center;
            outline: none;
            padding: 4px 0;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .date-segment:focus {
            border-color: #FFFDF0;
        }

        .date-segment.unit { width: 38px; }
        .date-segment.year { width: 58px; }

        .date-divider {
            color: rgba(255, 253, 240, 0.3);
            font-size: 14px;
        }

        /* Стрілка */
        .arrow-right {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 253, 240, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            margin-left: 8px;
        }

        .arrow-right.visible {
            opacity: 1;
            animation: arrowPulse 6s infinite ease-in-out;
        }

        @keyframes arrowPulse {
            0%, 100% { box-shadow: 0 0 4px rgba(255, 253, 240, 0.2); transform: scale(1); }
            50% { box-shadow: 0 0 14px rgba(255, 253, 240, 0.8); transform: scale(1.08); }
        }

        .arrow-right svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #FFFDF0;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Комета */
        .comet-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #FFFDF0;
            border-radius: 50%;
            box-shadow: 0 0 16px 3px #FFFDF0;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
        }
    </style>
</head>
<body>

    <canvas id="fxCanvas"></canvas>

    <div class="singularity pulse-active" id="singularity"></div>

    <div class="atom-container" id="atom">
        <div class="orbit"><div class="electron"></div></div>
        <div class="orbit"><div class="electron"></div></div>
        <div class="orbit"><div class="electron"></div></div>
        <div class="atom-core"></div>
    </div>

    <div class="stage-container">
        <div class="caption" id="captionText">The birth of your digital origin</div>
        
        <div class="date-box" id="dateBox">
            <input type="text" class="date-segment unit" id="dayInput" placeholder="DD" maxlength="2" inputmode="numeric" autocomplete="off">
            <span class="date-divider">/</span>
            <input type="text" class="date-segment unit" id="monthInput" placeholder="MM" maxlength="2" inputmode="numeric" autocomplete="off">
            <span class="date-divider">/</span>
            <input type="text" class="date-segment year" id="yearInput" placeholder="YYYY" maxlength="4" inputmode="numeric" autocomplete="off">
            
            <div class="arrow-right" id="arrowBtn">
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </div>
        </div>
    </div>

    <div class="comet-particle" id="comet"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const singularity = document.getElementById('singularity');
        const atom = document.getElementById('atom');
        const captionText = document.getElementById('captionText');
        const dateBox = document.getElementById('dateBox');
        const dayInput = document.getElementById('dayInput');
        const monthInput = document.getElementById('monthInput');
        const yearInput = document.getElementById('yearInput');
        const comet = document.getElementById('comet');
        const arrowBtn = document.getElementById('arrowBtn');

        let isEvolved = false;
        let isCometLaunched = false;

        function haptic(type = 'light') {
            if (tg.HapticFeedback) {
                if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
                else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
                else tg.HapticFeedback.impactOccurred('light');
            }
        }

        const pulseInterval = setInterval(() => {
            if (!isEvolved) {
                setTimeout(() => haptic('light'), 3000);
            } else {
                clearInterval(pulseInterval);
            }
        }, 6000);

        singularity.addEventListener('click', () => {
            if (isEvolved) return;
            isEvolved = true;
            clearInterval(pulseInterval);
            haptic('medium');

            // 1. Початок плавного вибуху частинок на Canvas
            startSlowMoSupernova();

            singularity.style.opacity = '0';
            setTimeout(() => singularity.style.display = 'none', 200);

            // 2. Виростання ядра з центру (плавний zoom-in)
            setTimeout(() => {
                atom.classList.add('zooming');

                // Коли ядро наблизилось, розгортаємо орбіти та вмикаємо дихання
                setTimeout(() => {
                    atom.classList.add('orbits-ready');
                    atom.classList.add('breath');

                    setTimeout(() => {
                        captionText.style.opacity = '1';
                        atom.style.pointerEvents = 'all';
                        atom.style.cursor = 'pointer';
                    }, 2500);
                }, 1800);

            }, 300);
        });

        // Плавний Canvas-вибух (Slow-Mo)
        function startSlowMoSupernova() {
            const particles = [];
            const count = 50;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.8 + Math.random() * 1.5; // Повільна швидкість
                particles.push({
                    x: centerX,
                    y: centerY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 1 + Math.random() * 1.8,
                    alpha: 1,
                    friction: 0.985 // М'яке гальмування в просторі
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.alpha > 0.01) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vx *= p.friction;
                        p.vy *= p.friction;
                        p.alpha -= 0.007; // Повільне згасання (2.5сек)

                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillStyle = '#FFFDF0';
                        ctx.shadowColor = '#FFFDF0';
                        ctx.shadowBlur = 6;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });

                if (alive) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            requestAnimationFrame(animate);
        }

        atom.addEventListener('click', () => {
            if (!isEvolved) return;
            haptic('light');

            captionText.style.opacity = '0';
            
            setTimeout(() => {
                captionText.style.display = 'none';
                dateBox.classList.add('active');
                dayInput.focus();
            }, 800);
        });

        function sanitizeInput(input, maxVal) {
            input.value = input.value.replace(/\D/g, '');
            if (maxVal && parseInt(input.value) > maxVal) {
                input.value = maxVal.toString();
            }
        }

        dayInput.addEventListener('input', () => {
            sanitizeInput(dayInput, 31);
            if (dayInput.value.length === 2) monthInput.focus();
            checkAndLaunchComet();
        });

        monthInput.addEventListener('input', () => {
            sanitizeInput(monthInput, 12);
            if (monthInput.value.length === 2) yearInput.focus();
            checkAndLaunchComet();
        });

        yearInput.addEventListener('input', () => {
            sanitizeInput(yearInput, 2026);
            checkAndLaunchComet();
        });

        function checkAndLaunchComet() {
            if (isCometLaunched) return;
            if (dayInput.value.length > 0 || monthInput.value.length > 0 || yearInput.value.length > 0) {
                triggerComet();
            }
        }

        function triggerComet() {
            isCometLaunched = true;
            haptic('medium');

            atom.style.transition = 'all 0.6s ease';
            atom.style.opacity = '0';
            atom.style.transform = 'scale(0.1)';

            setTimeout(() => {
                const rect = dateBox.getBoundingClientRect();
                
                comet.style.left = (rect.left - 15) + 'px';
                comet.style.top = (rect.top - 5) + 'px';
                comet.style.opacity = '1';

                setTimeout(() => {
                    comet.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
                    comet.style.left = (rect.right + 8) + 'px';
                    comet.style.top = (rect.top + 5) + 'px';

                    setTimeout(() => {
                        comet.style.opacity = '0';
                        arrowBtn.classList.add('visible');
                        haptic('heavy');
                    }, 750);
                }, 100);
            }, 300);
        }

        arrowBtn.addEventListener('click', () => {
            haptic('heavy');
        });
    </script>
</body>
</html>
